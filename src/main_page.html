<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Homework 21.2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
     <style>
    html, body {
      height: 100%;
    }
    .sidebar {
      min-height: 100vh;
    }
    .product-header {
    background-color: pink;
    text-align: center;
    padding: 10px;
    color: blue;
    margin: 0;
    }

  .product-body {
    background-color: white;
    padding: 30px;
    color: black;
    }

  .buy-button {
    background-color: white;
    color: blue;
    border: 2px solid blue;
    width: 100%;
    border-radius: 15px;
    padding: 5px;
    }
  </style>
</head>
<body>
<div>
    <div class="row">
        <div class="col-2 border bg-secondary text-white d-flex flex-column sidebar">
            <h4 class="container text-center mt-4 fw-bold">Menu</h4>
            <div class="px-3">
                <p><button class="btn btn-primary w-100 text-start">🏠 Main page</button></p>
                <p><button class="btn btn-secondary w-100 text-start">📑 Catalogue</button></p>
                <p><button class="btn btn-secondary w-100 text-start">🗂 Categories</button></p>
                <p><button class="btn btn-secondary w-100 text-start">🌐 Contacts</button></p>
            </div>
            <div class="mt-auto mb-3 px-3">
                <p><button class="btn btn-secondary w-100">Profile</button></p>
                <p><button class="btn btn-secondary w-100">Exit</button></p>
                <div class="px-2">
                    <div class="dropdown">
                      <button class="btn btn-outline-red dropdown-toggle w-100" type="button"
                              id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                        USER
                      </button>
                      <ul class="dropdown-menu w-100" aria-labelledby="userDropdown">
                        <li><a class="dropdown-item" href="#">Profile</a></li>
                        <li><a class="dropdown-item" href="#">Settings</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="#">Logout</a></li>
                      </ul>
                    </div>
                  </div>
            </div>
        </div>
        <div class="col-10 border bg-light">
          <div class="container py-4">
            <h3 class="text-center mb-4">Main page</h3>
            <p class="text-center">You are on the trading site</p>

            <div class="row row-cols-1 row-cols-md-3 g-4">
              <!-- Card 1 -->
                <div class="col">
                  <div class="card h-100">

                    <!-- Top Area with Grey Background -->
                    <div class="product-header">
                      <h4>Product 1</h4>
                    </div>

                    <!-- Body Area (White Background) -->
                    <div class="product-body">
                      <h1 class="text-center">₽199</h1>
                      <p class="text-center">This is a short description of Product 1.</p>

                      <!-- Buy Button -->
                      <div class="mt-auto">
                        <button class="buy-button fw-bold">Buy</button>
                      </div>
                    </div>
                  </div>
                </div>

              <!-- Card 2 -->
              <div class="col">
                  <div class="card h-100">

                    <!-- Top Area with Grey Background -->
                    <div class="product-header">
                      <h4>Product 2</h4>
                    </div>

                    <!-- Body Area (White Background) -->
                    <div class="product-body">
                      <h1 class="text-center">₽299</h1>
                      <p class="text-center">This is a short description of Product 2.</p>

                      <!-- Buy Button -->
                      <div class="mt-auto">
                        <button class="buy-button fw-bold">Buy</button>
                      </div>
                    </div>
                  </div>
                </div>

              <!-- Card 3 -->
              <div class="col">
                  <div class="card h-100">

                    <!-- Top Area with Grey Background -->
                    <div class="product-header">
                      <h4>Product 3</h4>
                    </div>

                    <!-- Body Area (White Background) -->
                    <div class="product-body">
                      <h1 class="text-center">₽399</h1>
                      <p class="text-center">This is a short description of Product 3.</p>

                      <!-- Buy Button -->
                      <div class="mt-auto">
                        <button class="buy-button fw-bold">Buy</button>
                      </div>
                    </div>
                  </div>
                </div>
            </div>
          </div>
        </div>
    </div>
</div>
</body>
</html>
